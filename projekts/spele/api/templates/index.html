<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Untitled Tetris Game - Līderu tabula</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🏆 Untitled Tetris Game - TOP 10</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Vieta</th>
                    <th>Spēlētājs</th>
                    <th>Punkti</th>
                </tr>
            </thead>
            <tbody>
                {% for row in scores %}
                <tr {% if loop.index == 1 %}class="gold-row"{% endif %}>
                    <td>{{ loop.index }}</td>
                    <!-- Ссылка на профиль конкретного игрока -->
                    <td><a href="/profile/{{ row[0] }}">{{ row[0] }}</a></td>
                    <td>{{ row[1] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <div class="nav-links">
            <a href="/rules">Spēles noteikumi</a>
        </div>
    </div>
</body>
</html>
